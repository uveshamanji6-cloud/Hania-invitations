<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hania's Birthday Invitation</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 25%,#fff8f3,#efd7ce 65%,#d8b7a9);display:flex;align-items:center;justify-content:center;color:#6b4437}
.scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:1200px}
.intro{text-align:center;transition:opacity .5s,transform .7s}.intro.hide{opacity:0;transform:scale(.8);pointer-events:none;position:absolute}
.small{font-size:15px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
.envelope{width:min(82vw,360px);height:min(55vw,240px);position:relative;cursor:pointer;transform-style:preserve-3d;filter:drop-shadow(0 15px 20px rgba(90,55,40,.2))}
.env-back{position:absolute;inset:0;background:linear-gradient(145deg,#f8ddd5,#e8b9ad);border-radius:8px}
.env-front{position:absolute;inset:0;background:#edc5bb;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:8px}
.flap{position:absolute;left:0;top:0;width:100%;height:65%;background:linear-gradient(160deg,#f9e5df,#e4b0a5);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s cubic-bezier(.2,.8,.2,1);z-index:4}
.seal{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);z-index:6;width:58px;height:58px;border-radius:50%;background:#c99968;color:white;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 4px 10px #9d7255aa}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}.envelope.open .seal{opacity:0;transition:.3s}
.tap{margin-top:20px;font-size:17px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.04);opacity:.65}}
.card-wrap{position:absolute;width:min(92vw,560px);height:92vh;max-height:900px;opacity:0;transform:translateY(50px) scale(.85) rotateX(-8deg);transition:opacity .9s,transform 1s cubic-bezier(.16,.84,.2,1);pointer-events:none}
.card-wrap.show{opacity:1;transform:none;pointer-events:auto}
.card{width:100%;height:100%;border-radius:18px;overflow:auto;background:#fff;box-shadow:0 25px 60px rgba(80,45,35,.35);scrollbar-width:none}.card::-webkit-scrollbar{display:none}
.card img{display:block;width:100%;height:auto}.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#8b6256;font-size:12px}
.replay{position:fixed;right:14px;top:14px;border:0;border-radius:30px;padding:10px 14px;background:#fff7f2cc;color:#704b40;box-shadow:0 4px 14px #0002;display:none;z-index:20}.replay.show{display:block}
</style>
</head>
